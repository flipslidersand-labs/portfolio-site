name: Quality

on:
  push:
    branches: [master, main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/node-test.yml@main
    with:
      # Astro 6.x は Node >=22.12.0 が必要
      node-version: "22"
      package-manager: "npm"
      run-test: false
      run-build: true
      run-lint: false
